<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="fundo">
        <div class="calculadora">
            <p id="resultado">resultado</p>

            <table>
                <tr>
                    <td><button class="botoes">C</button></td>
                    <td><button class="botoes"><</button></td>
                    <td><button class="botoes">/</button></td>
                    <td><button class="botoes">*</button></td>
                </tr>
                <tr>
                    <td><button class="botoes">7</button></td>
                    <td><button class="botoes">8</button></td>
                    <td><button class="botoes">9</button></td>
                    <td><button class="botoes">-</button></td>
                </tr>
                <tr>
                    <td><button class="botoes">4</button></td>
                    <td><button class="botoes">5</button></td>
                    <td><button class="botoes">6</button></td>
                    <td><button class="botoes">+</button></td>
                </tr>
                <tr>
                    <td><button class="botoes">1</button></td>
                    <td><button class="botoes">2</button></td>
                    <td><button class="botoes">3</button></td>
                    <td rowspan="2"><button class="botoes botao-igual">=</button></td>
                </tr>
                <tr>
                    <td colspan="2"><button class="botoes botao-zero">0</button></td>
                    <td><button class="botoes">.</button></td>
                </tr>

            </table>
        </div>
    </div>
</body>
</html>
